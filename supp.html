<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Supplementary reading – Paper Library</title>
  <link rel="icon" href="icons/icon32.png">
  <link rel="stylesheet" href="viewer.css">
  <link rel="stylesheet" href="supp.css">
  <script src="js/theme.js"></script>
  <script type="module" src="supp.js"></script>
</head>
<body>
  <svg xmlns="http://www.w3.org/2000/svg" hidden>
    <symbol id="i-tri" viewBox="0 0 16 16"><path fill="currentColor" d="M5 3l6 5-6 5z"/></symbol>
    <symbol id="i-download" viewBox="0 0 16 16"><path fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" d="M8 2v8M4.5 6.8 8 10.3l3.5-3.5M2.5 13.5h11"/></symbol>
    <symbol id="i-external" viewBox="0 0 16 16"><path fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" d="M9 2.5h4.5V7M13.5 2.5 7.5 8.5M12 10v3.5H2.5V4H6"/></symbol>
    <symbol id="i-cloud" viewBox="0 0 16 16"><path fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" d="M4.5 12.5h7.2a2.8 2.8 0 0 0 .3-5.6A4 4 0 0 0 4.3 7a2.8 2.8 0 0 0 .2 5.5z"/></symbol>
    <symbol id="i-swap" viewBox="0 0 16 16"><path fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" d="M2.5 5.5h10M10 3l2.5 2.5L10 8M13.5 10.5h-10M6 8l-2.5 2.5L6 13"/></symbol>
    <symbol id="i-paper" viewBox="0 0 16 16"><path fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round" d="M3.5 1.5h6l3 3v10h-9z"/><path fill="none" stroke="currentColor" stroke-width="1.3" d="M9.5 1.5v3h3M5.5 8h5M5.5 10.5h5"/></symbol>
  </svg>

  <div id="app">
    <header class="toolbar">
      <div class="tb-group">
        <a id="btnHome" class="tb-btn" href="library.html" title="Paper Library"><img src="icons/icon32.png" alt="" width="20" height="20"></a>
        <div class="supp-title">
          <b id="paperTitle">Loading…</b>
          <span id="paperSub" class="muted"></span>
        </div>
      </div>
      <div class="tb-group tb-right">
        <button id="btnSwap" class="tb-btn" title="Swap sides"><svg><use href="#i-swap"/></svg></button>
        <button id="btnNormal" class="btn" title="Back to normal reading: the paper only"><svg><use href="#i-paper"/></svg>Paper only</button>
      </div>
    </header>

    <div id="split" class="split">
      <section id="paperPane" class="pane paper-pane">
        <iframe id="paperFrame" title="Paper"></iframe>
      </section>
      <div id="divider" class="divider" role="separator" aria-orientation="vertical" aria-label="Resize panels" tabindex="0"
           title="Drag to resize (double-click: half and half)"></div>
      <aside id="suppPane" class="pane supp-pane" aria-label="Supplementary files">
        <div class="supp-head">
          <span id="suppHeading">Supplementary files</span>
          <span class="supp-head-actions">
            <button id="btnExpandAll" class="link-btn">Expand all</button>
            <button id="btnCollapseAll" class="link-btn">Collapse all</button>
          </span>
        </div>
        <div id="suppList" class="accordion"></div>
        <div id="suppMsg" class="supp-msg" hidden></div>
      </aside>
    </div>
  </div>

  <div id="toast" class="toast" hidden></div>
</body>
</html>
